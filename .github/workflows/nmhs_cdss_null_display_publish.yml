name: NMHS CDSS Null Display Candidate Publication

on:
  push:
    branches:
      - g5-cdss-null-display-fallback-v1-image-publication-v1
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/emenogu/nmhs-cdss-reference
  SOURCE_SHA: cfa26fa9fad9e064f00adac3735e0035ac8a1fc6
  IMAGE_TAG: g5-cfa26fa9fad9e064f00adac3735e0035ac8a1fc6

jobs:
  build-and-publish:
    name: Build exact validated CDSS candidate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact validated source
        uses: actions/checkout@v4
        with:
          ref: cfa26fa9fad9e064f00adac3735e0035ac8a1fc6

      - name: Prove exact source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "SOURCE_SHA=$(git rev-parse HEAD)"
          echo "SOURCE_TREE=$(git rev-parse HEAD^{tree})"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '17'
          cache: maven

      - name: Reconfirm Maven package
        run: mvn -B -ntp clean package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: package/docker/cdss/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.title=NMHS CDSS null-display candidate

      - name: Emit immutable image evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "IMAGE=${IMAGE_NAME}:${IMAGE_TAG}"
          echo "DIGEST=${{ steps.build.outputs.digest }}"
          echo "IMMUTABLE_REF=${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
