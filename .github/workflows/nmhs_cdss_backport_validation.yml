name: NMHS CDSS Backport Validation

on:
  push:
    branches:
      - g4-cdss-normalform-parser-backport-v1

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/nmhs-cdss-reference

jobs:
  validate-and-publish:
    name: Test and publish immutable candidate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'
          cache: maven

      - name: Maven test and package
        run: mvn -B -ntp clean package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish amd64 candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: package/docker/cdss/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:g4-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=NMHS CDSS reference candidate
